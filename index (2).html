<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Chatbot</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px;
           margin: 40px auto; padding: 0 16px; background: #f5f5f5; }
    #messages { height: 400px; overflow-y: auto; background: white;
                border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .input-row { display: flex; gap: 8px; }
    #userInput { flex: 1; padding: 12px 16px; border: 1px solid #ddd;
                 border-radius: 24px; font-size: 14px; outline: none; }
    button { padding: 12px 20px; background: #7c3aed; color: white;
             border: none; border-radius: 24px; cursor: pointer; font-size: 14px; }
  </style>
</head>
<body>
  <h2>My AI Chatbot 🤖</h2>
  <div id="messages"></div>
  <div class="input-row">
    <input id="userInput" placeholder="Type your message..."
           onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Send</button>
  </div>
  <script>
    function addMessage(who, text) {
      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.style.cssText = 'margin:8px 0;padding:10px 14px;border-radius:18px;max-width:80%;font-size:14px;line-height:1.5';
      if (who === 'You') {
        div.style.cssText += ';background:#7c3aed;color:white;margin-left:auto';
      } else {
        div.style.cssText += ';background:#f0f0f0;color:#111';
      }
      div.textContent = who + ': ' + text;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const userText = input.value.trim();
      if (!userText) return;
      input.value = '';
      addMessage('You', userText);

      const API_KEY = 'YOUR_GROQ_KEY_HERE'; // ← paste your gsk_... key here
      const url = 'https://api.groq.com/openai/v1/chat/completions';

      const response = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + API_KEY
        },
        body: JSON.stringify({
          model: 'llama-3.1-8b-instant',
          messages: [{ role: 'user', content: userText }]
        })
      });

      const data = await response.json();
      const reply = data.choices[0].message.content;
      addMessage('Groq', reply);
    }
  </script>
</body>
</html>
